<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>💣 쌈뽕 지뢰찾기 (SsamPong Minesweeper) - 네온 & 클래식</title>
  <link rel="stylesheet" href="style.css">
  <!-- Canvas Confetti for Victory Celebration -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body class="theme-neon">
  <div class="minesweeper-app">

    <!-- Top Navigation & Header -->
    <header class="app-header">
      <div class="header-left">
        <a href="../index.html" class="nav-back-btn">🏠 게임 허브</a>
        <h1 class="game-logo">💣 쌈뽕 지뢰찾기 <span class="logo-badge">MINESWEEPER</span></h1>
      </div>
      <div class="header-right">
        <!-- Visual Theme Picker -->
        <div class="theme-picker-group">
          <span class="picker-label">🎨 테마:</span>
          <button class="theme-pill active" data-theme="theme-neon" title="사이버 네온">🌌 네온</button>
          <button class="theme-pill" data-theme="theme-classic" title="클래식 윈도우">🪟 클래식</button>
          <button class="theme-pill" data-theme="theme-dark" title="모던 다크">🌑 다크</button>
        </div>
      </div>
    </header>

    <!-- Difficulty & Config Toolbar -->
    <section class="toolbar">
      <div class="diff-btn-group">
        <button class="diff-btn active" data-diff="easy">🌱 초급 (9×9)</button>
        <button class="diff-btn" data-diff="normal">⚡ 중급 (16×16)</button>
        <button class="diff-btn" data-diff="hard">🔥 고급 (16×30)</button>
        <button class="diff-btn" data-diff="custom">🛠️ 커스텀</button>
      </div>

      <div class="best-time-box">
        <span class="best-icon">🏆</span>
        <span class="best-label">최고 기록:</span>
        <span class="best-val" id="best-score-display">--초</span>
      </div>
    </section>

    <!-- Main Game Frame (Retro & Neon Console) -->
    <main class="console-box">

      <!-- Status Header (LED Digit Counters & Smile Face) -->
      <section class="hud-bar">
        <!-- Mine Counter -->
        <div class="digital-counter-wrapper">
          <div class="counter-label">MINES</div>
          <div class="digital-lcd" id="mine-counter">010</div>
        </div>

        <!-- Face Emoji Button -->
        <button class="face-btn" id="face-btn" title="새 게임 시작 (클릭)">
          <span id="face-emoji">😊</span>
        </button>

        <!-- Timer Counter -->
        <div class="digital-counter-wrapper">
          <div class="counter-label">TIME</div>
          <div class="digital-lcd" id="time-counter">000</div>
        </div>
      </section>

      <!-- Mobile Touch Controls Bar -->
      <section class="touch-controls-bar">
        <div class="mode-toggle-group">
          <button id="tool-dig" class="touch-tool-btn active">
            <span class="tool-icon">⛏️</span>
            <span class="tool-text">파기 모드</span>
          </button>
          <button id="tool-flag" class="touch-tool-btn">
            <span class="tool-icon">🚩</span>
            <span class="tool-text">깃발 모드</span>
          </button>
        </div>
        <div class="quick-tools-group">
          <button id="btn-hint" class="quick-btn" title="안전한 칸 힌트">
            <span>💡 힌트</span>
          </button>
          <button id="btn-sound-toggle" class="quick-btn" title="소리 켜기/끄기">
            <span id="sound-icon">🔊 소리</span>
          </button>
        </div>
      </section>

      <!-- Minesweeper Board Arena -->
      <div class="board-viewport" id="board-viewport">
        <div class="mine-board" id="mine-board">
          <!-- Dynamically generated squares -->
        </div>
      </div>

      <!-- Quick Info / Help Footer -->
      <footer class="console-footer">
        <span>💡 <strong>조작 팁:</strong> 좌클릭(열기) | 우클릭(깃발) | 열린 숫자 클릭(주변 일괄 열기) | 모바일은 상단 모드 전환 사용</span>
      </footer>

    </main>

  </div>

  <!-- Custom Difficulty Modal -->
  <div class="modal-overlay hidden" id="custom-modal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3>🛠️ 사용자 지정 난이도 설정</h3>
        <button class="modal-close-btn" id="btn-custom-close">✕</button>
      </div>
      <div class="modal-body">
        <div class="input-row">
          <label for="custom-rows">가로 줄 (높이: 8 ~ 30):</label>
          <input type="number" id="custom-rows" min="8" max="30" value="16">
        </div>
        <div class="input-row">
          <label for="custom-cols">세로 줄 (너비: 8 ~ 40):</label>
          <input type="number" id="custom-cols" min="8" max="40" value="30">
        </div>
        <div class="input-row">
          <label for="custom-mines">지뢰 개수 (10 ~ 300):</label>
          <input type="number" id="custom-mines" min="10" max="300" value="99">
        </div>
      </div>
      <div class="modal-footer">
        <button id="btn-custom-cancel" class="btn-secondary">취소</button>
        <button id="btn-custom-apply" class="btn-primary">게임 시작</button>
      </div>
    </div>
  </div>

  <!-- Game Win / Over Modal -->
  <div class="modal-overlay hidden" id="result-modal">
    <div class="modal-dialog result-dialog">
      <div class="result-trophy" id="result-icon">🏆</div>
      <h2 id="result-title">지뢰 찾기 클리어!</h2>
      <p id="result-desc">모든 지뢰를 찾아내고 안전지대를 확보했습니다!</p>
      
      <div class="result-stats">
        <div class="stat-item">
          <span class="stat-label">난이도</span>
          <strong id="stat-diff" class="stat-val">초급 (9×9)</strong>
        </div>
        <div class="stat-item">
          <span class="stat-label">클리어 시간</span>
          <strong id="stat-time" class="stat-val highlight">15초</strong>
        </div>
        <div class="stat-item">
          <span class="stat-label">최고 기록</span>
          <strong id="stat-best" class="stat-val">15초 (신기록!)</strong>
        </div>
      </div>

      <div class="modal-footer">
        <button id="btn-modal-review" class="btn-secondary">🔍 맵 구경하기</button>
        <button id="btn-modal-restart" class="btn-primary">🔁 다시 플레이</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
