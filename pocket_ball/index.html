<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🎱 쌈뽕 포켓볼 (SsamPong Pocket Ball) - 8볼 & 2인/AI 대전</title>
  <link rel="stylesheet" href="style.css">
  <!-- Canvas Confetti for Victory Celebration -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body class="theme-green">
  <div class="pool-app-container">

    <!-- Top Navigation & Header -->
    <header class="app-header">
      <div class="header-left">
        <a href="../index.html" class="nav-back-btn">🏠 게임 허브</a>
        <h1 class="game-logo">🎱 쌈뽕 포켓볼 <span class="logo-badge">8-BALL POOL</span></h1>
      </div>
      <div class="header-right">
        <!-- Table Theme Picker -->
        <div class="theme-picker-group">
          <span class="picker-label">🎨 테이블:</span>
          <button class="theme-pill active" data-theme="theme-green" title="클래식 그린">🌿 그린</button>
          <button class="theme-pill" data-theme="theme-blue" title="토너먼트 블루">💙 블루</button>
          <button class="theme-pill" data-theme="theme-neon" title="사이버 네온">🌌 네온</button>
        </div>
      </div>
    </header>

    <!-- Settings Bar -->
    <section class="settings-bar">
      <!-- Game Mode -->
      <div class="setting-item">
        <label>🎮 게임 모드</label>
        <div class="pill-group">
          <button id="mode-solo" class="pill-btn active" data-mode="solo">🎯 1인 연습</button>
          <button id="mode-2p" class="pill-btn" data-mode="2p">👥 2인 대전</button>
          <button id="mode-ai" class="pill-btn" data-mode="ai">🤖 AI 대결</button>
        </div>
      </div>

      <!-- Turn & Target Info Bar -->
      <div class="status-hud-box">
        <div class="player-turn-badge" id="player-turn-badge">
          <span class="turn-dot" id="turn-dot"></span>
          <span id="turn-title">내 차례 (샷 준비 완료)</span>
        </div>
        <div class="ball-group-tag" id="ball-group-tag">자유구 (아무 공이나 포켓팅)</div>
      </div>

      <!-- Quick Controls -->
      <div class="quick-controls-group">
        <button id="btn-guide-toggle" class="ctrl-btn active" title="가이드 조준선 켜기/끄기">
          <span id="guide-icon">🎯 조준선 ON</span>
        </button>
        <button id="btn-sound-toggle" class="ctrl-btn" title="사운드 켜기/끄기">
          <span id="sound-icon">🔊 소리</span>
        </button>
        <button id="btn-rerack" class="ctrl-btn primary" title="공 다시 배치">
          <span>🔄 리랙 (재배치)</span>
        </button>
      </div>
    </section>

    <!-- Main Game Arena -->
    <main class="game-arena">

      <!-- Table Viewport -->
      <div class="table-container" id="table-container">
        <canvas id="poolCanvas" width="1020" height="560"></canvas>
        <div class="foul-alert hidden" id="foul-alert">⚠️ 파울! (스크래치)</div>
      </div>

      <!-- Bottom Control & HUD Bar -->
      <section class="bottom-hud">

        <!-- Pocketed Balls Display -->
        <div class="pocketed-panel">
          <div class="panel-header">
            <span>포켓된 공 목록</span>
            <span class="stroke-count" id="stroke-count">스트로크: 0타</span>
          </div>
          <div class="pocketed-balls-tray" id="pocketed-tray">
            <!-- Pocketed mini balls -->
          </div>
        </div>

        <!-- Shot Power Bar & Strike Button -->
        <div class="shot-controls">
          <div class="power-wrapper">
            <span class="power-label">⚡ 샷 파워 (드래그 또는 슬라이더)</span>
            <div class="power-slider-box">
              <input type="range" id="power-slider" min="5" max="100" value="45">
              <span class="power-val-text" id="power-val">45%</span>
            </div>
          </div>
          <button id="btn-strike" class="strike-btn" title="공 치기">
            <span>💥 샷 치기 (스페이스바)</span>
          </button>
        </div>

      </section>

    </main>

    <!-- Footer Help -->
    <footer class="pool-footer">
      <span>💡 <strong>조작법:</strong> 마우스/터치로 큐 각도 조준 | 큐대를 뒤로 당겼다 놓거나 파워바로 파워 조절 후 샷! | 흰 공 배치 가능</span>
    </footer>

  </div>

  <!-- Game Win / Over Modal -->
  <div class="modal-overlay hidden" id="result-modal">
    <div class="result-dialog">
      <div class="result-trophy" id="result-icon">🏆</div>
      <h2 id="result-title">8볼 포켓 클리어!</h2>
      <p id="result-desc">환상적인 샷으로 승리했습니다!</p>
      
      <div class="result-stats">
        <div class="stat-item">
          <span class="stat-label">모드</span>
          <strong id="stat-mode">1인 연습</strong>
        </div>
        <div class="stat-item">
          <span class="stat-label">총 샷 수</span>
          <strong id="stat-strokes" class="stat-highlight">12타</strong>
        </div>
        <div class="stat-item">
          <span class="stat-label">포켓팅 수</span>
          <strong id="stat-pocketed">15 / 15개</strong>
        </div>
      </div>

      <div class="modal-btns">
        <button id="btn-modal-review" class="btn-secondary">🔍 테이블 보기</button>
        <button id="btn-modal-restart" class="btn-primary">🔁 다시 시작</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
